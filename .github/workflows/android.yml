# Builds the FoxBox Android app (APK) whenever the app changes.
# To get it: open the repository's "Actions" tab, click the latest
# "Android app" run, and download "FoxBox-android" under Artifacts.
name: Android app

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../FoxBox.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FoxBox-android
          path: FoxBox.apk
