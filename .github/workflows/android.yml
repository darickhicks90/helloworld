# Builds 5 Eye Yeti (5IY): a signed App Bundle (.aab) for Google Play and an APK for
# sideloading, plus 5IY Builder (the world editor), Wildwood Hall (the game) and 5IY Pocket
# (radio + notebook) and Little Yeti (for kids), each as its own APK. Download them from the run's "Artifacts" section.
# Release signing uses the FOXBOX_UPLOAD_* secrets when they are set
# (see android/play/release-checklist.md); otherwise the test key is used.
name: Android app

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare upload key
        env:
          KEYSTORE_B64: ${{ secrets.FOXBOX_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "FOXBOX_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Signing with the upload key"
          else
            echo "No upload key secret: signing with the test key"
          fi

      - name: Build APK and App Bundle
        env:
          FOXBOX_UPLOAD_STORE_PASSWORD: ${{ secrets.FOXBOX_UPLOAD_STORE_PASSWORD }}
          FOXBOX_UPLOAD_KEY_ALIAS: ${{ secrets.FOXBOX_UPLOAD_KEY_ALIAS }}
          FOXBOX_UPLOAD_KEY_PASSWORD: ${{ secrets.FOXBOX_UPLOAD_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease :builder:assembleRelease :game:assembleRelease :pocket:assembleRelease :kids:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../5IY.apk
          cp builder/build/outputs/apk/release/builder-release.apk ../5IY-Builder.apk
          # The Play bundle is only built with the real upload key: a bundle signed with the public
          # test key must never reach Google Play (Play would adopt it as the upload key).
          if [ -n "$FOXBOX_UPLOAD_STORE_FILE" ]; then
            ./gradlew --no-daemon :app:bundleRelease
            cp app/build/outputs/bundle/release/app-release.aab ../5IY-release.aab
          else
            echo "No upload key: skipping the Play bundle"
          fi
          cp game/build/outputs/apk/release/game-release.apk ../Wildwood-Hall.apk
          cp pocket/build/outputs/apk/release/pocket-release.apk ../5IY-Pocket.apk
          cp kids/build/outputs/apk/release/kids-release.apk ../Little-Yeti.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 5IY-android
          path: 5IY.apk

      - name: Upload Builder APK
        uses: actions/upload-artifact@v4
        with:
          name: 5IY-builder
          path: 5IY-Builder.apk

      - name: Upload App Bundle
        if: env.FOXBOX_UPLOAD_STORE_FILE != ''
        uses: actions/upload-artifact@v4
        with:
          name: 5IY-play-bundle
          path: 5IY-release.aab

      - name: Upload game APK
        uses: actions/upload-artifact@v4
        with:
          name: wildwood-hall
          path: Wildwood-Hall.apk

      - name: Upload Pocket APK
        uses: actions/upload-artifact@v4
        with:
          name: 5IY-pocket
          path: 5IY-Pocket.apk

      - name: Upload Little Yeti APK
        uses: actions/upload-artifact@v4
        with:
          name: little-yeti
          path: Little-Yeti.apk
